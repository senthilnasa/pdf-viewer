; PHP limits for PHP-FPM / CGI hosts (cPanel, Plesk, most shared hosting).
; On those servers the php_value lines in .htaccess are ignored, so PHP kept
; its 8M default post_max_size and every larger PDF upload was rejected.
; Keep these >= max_upload_size in config/app.php.
upload_max_filesize = 100M
post_max_size = 105M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
